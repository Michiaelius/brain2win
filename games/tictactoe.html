<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe – Brain2Win</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .ttt-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .ttt-board {
            display: grid;
            grid-template-columns: 110px 110px 110px;
            grid-template-rows: 110px 110px 110px;
            gap: 6px;
            background: #334155;
            padding: 10px;
            border-radius: 14px;
            margin: 1.2rem 0;
        }
        .cell {
            width: 110px;
            height: 110px;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.4rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 10px;
            user-select: none;
            box-sizing: border-box;
            line-height: 1;
        }
        .cell:hover:not(.taken) {
            background: #334155;
        }
        .cell.x { color: #38bdf8; }
        .cell.o { color: #f472b6; }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            justify-content: center;
            margin: 0.8rem 0;
        }
        .controls button.active {
            background: #0ea5e9;
        }
        .status {
            font-size: 1.15rem;
            min-height: 1.6em;
            margin: 0.5rem 0;
        }
    </style>
</head>
<body>
    <div class="container game-container">
        <a href="../index.html" class="back">← Zurück</a>
        <h1>Tic-Tac-Toe</h1>
        <p>Skill-basiert – lokal, online (bald) oder gegen KI.</p>

        <div class="controls" id="mode-controls">
            <button id="btn-local" class="active" onclick="setMode('local')">Lokal (2 Spieler)</button>
            <button id="btn-online" onclick="setMode('online')">Online (bald)</button>
            <button id="btn-ai" onclick="setMode('ai')">Gegen KI</button>
        </div>

        <div id="ai-controls" class="controls" style="display:none;">
            <span style="align-self:center; margin-right:0.4rem;">Schwierigkeit:</span>
            <button id="diff-easy" onclick="setDifficulty('easy')">Leicht</button>
            <button id="diff-medium" class="active" onclick="setDifficulty('medium')">Mittel</button>
            <button id="diff-hard" onclick="setDifficulty('hard')">Schwer</button>
        </div>

        <div class="status" id="status">Spieler X ist am Zug</div>
        <div class="ttt-wrapper">
            <div class="ttt-board" id="board"></div>
        </div>
        <button onclick="resetGame()">Neues Spiel</button>
    </div>

    <script>
        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('status');
        const aiControls = document.getElementById('ai-controls');

        let board = Array(9).fill(null);
        let current = 'X';
        let gameOver = false;
        let mode = 'local';
        let difficulty = 'medium';
        const human = 'X';
        const ai = 'O';

        const wins = [
            [0,1,2],[3,4,5],[6,7,8],
            [0,3,6],[1,4,7],[2,5,8],
            [0,4,8],[2,4,6]
        ];

        function setMode(m) {
            mode = m;
            document.getElementById('btn-local').classList.toggle('active', m === 'local');
            document.getElementById('btn-online').classList.toggle('active', m === 'online');
            document.getElementById('btn-ai').classList.toggle('active', m === 'ai');
            aiControls.style.display = m === 'ai' ? 'flex' : 'none';

            if (m === 'online') {
                statusEl.textContent = 'Online-Modus kommt mit Accounts & Matchmaking.';
                gameOver = true;
            } else {
                resetGame();
            }
        }

        function setDifficulty(d) {
            difficulty = d;
            document.getElementById('diff-easy').classList.toggle('active', d === 'easy');
            document.getElementById('diff-medium').classList.toggle('active', d === 'medium');
            document.getElementById('diff-hard').classList.toggle('active', d === 'hard');
        }

        function render() {
            boardEl.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell' + (board[i] ? ' taken ' + board[i].toLowerCase() : '');
                cell.textContent = board[i] || '';
                cell.onclick = () => makeMove(i);
                boardEl.appendChild(cell);
            }
        }

        function makeMove(i) {
            if (gameOver || board[i] !== null) return;
            if (mode === 'ai' && current !== human) return;
            if (mode === 'online') return;

            board[i] = current;
            if (checkWin(current)) {
                statusEl.textContent = (mode === 'ai' && current === ai) ? 'KI gewinnt!' : `Spieler ${current} gewinnt!`;
                gameOver = true;
            } else if (board.every(c => c !== null)) {
                statusEl.textContent = 'Unentschieden!';
                gameOver = true;
            } else {
                current = current === 'X' ? 'O' : 'X';
                statusEl.textContent = (mode === 'ai' && current === ai) ? 'KI denkt...' : `Spieler ${current} ist am Zug`;
                render();
                if (mode === 'ai' && current === ai && !gameOver) {
                    setTimeout(aiMove, 400);
                }
                return;
            }
            render();
        }

        function aiMove() {
            const move = chooseAiMove();
            if (move !== null && board[move] === null) {
                board[move] = ai;
                if (checkWin(ai)) {
                    statusEl.textContent = 'KI gewinnt!';
                    gameOver = true;
                } else if (board.every(c => c !== null)) {
                    statusEl.textContent = 'Unentschieden!';
                    gameOver = true;
                } else {
                    current = human;
                    statusEl.textContent = 'Dein Zug (X)';
                }
                render();
            }
        }

        function chooseAiMove() {
            const perfect = minimax([...board], ai).index;
            const avail = board.map((v, i) => v === null ? i : null).filter(v => v !== null);
            if (!avail.length) return null;

            let mistakeChance = difficulty === 'easy' ? 0.6 : difficulty === 'medium' ? 0.28 : 0.1;
            if (Math.random() < mistakeChance) {
                const others = avail.filter(i => i !== perfect);
                if (others.length) return others[Math.floor(Math.random() * others.length)];
            }
            return perfect;
        }

        function minimax(newBoard, player) {
            const avail = newBoard.map((v, i) => v === null ? i : null).filter(v => v !== null);
            if (checkWinOn(newBoard, human)) return { score: -10 };
            if (checkWinOn(newBoard, ai)) return { score: 10 };
            if (avail.length === 0) return { score: 0 };

            const moves = [];
            for (const i of avail) {
                newBoard[i] = player;
                const result = minimax(newBoard, player === ai ? human : ai);
                moves.push({ index: i, score: result.score });
                newBoard[i] = null;
            }

            let best = moves[0];
            if (player === ai) {
                for (const m of moves) if (m.score > best.score) best = m;
            } else {
                for (const m of moves) if (m.score < best.score) best = m;
            }
            return best;
        }

        function checkWin(player) { return checkWinOn(board, player); }
        function checkWinOn(b, player) {
            return wins.some(c => c.every(i => b[i] === player));
        }

        function resetGame() {
            board = Array(9).fill(null);
            current = 'X';
            gameOver = false;
            statusEl.textContent = mode === 'ai' ? 'Dein Zug (X)' : 'Spieler X ist am Zug';
            render();
        }

        setMode('local');
        setDifficulty('medium');
    </script>
</body>
</html>
