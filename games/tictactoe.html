<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe – Brain2Win</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .ttt-wrapper { display: flex; flex-direction: column; align-items: center; }
        .ttt-board {
            display: grid;
            grid-template-columns: 110px 110px 110px;
            grid-template-rows: 110px 110px 110px;
            gap: 6px;
            background: #334155;
            padding: 10px;
            border-radius: 14px;
            margin: 1.2rem 0;
            position: relative;
            transition: opacity 0.3s;
        }
        .ttt-board.faded { opacity: 0.28; }
        .cell {
            width: 110px;
            height: 110px;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.4rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 10px;
            user-select: none;
            box-sizing: border-box;
            line-height: 1;
        }
        .cell:hover:not(.taken) { background: #334155; }
        .cell.x { color: #38bdf8; }
        .cell.o { color: #f472b6; }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            justify-content: center;
            margin: 0.8rem 0;
        }
        .controls button {
            background: #334155;
            color: #e2e8f0;
            border: 2px solid transparent;
        }
        .controls button.active {
            background: #1e293b;
            color: #38bdf8;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 0 1px #38bdf8;
        }
        .status { font-size: 1.15rem; min-height: 1.6em; margin: 0.5rem 0; text-align: center; }
        .scoreboard {
            background: linear-gradient(180deg, #1e293b, #0f172a);
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 0.8rem 1.4rem;
            margin: 0.8rem 0;
            display: flex;
            gap: 1.5rem;
            align-items: center;
            justify-content: center;
            font-family: system-ui, sans-serif;
            min-width: 280px;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .score-item .value { font-size: 1.8rem; font-weight: 700; color: #f1f5f9; }
        .score-item.x .value { color: #38bdf8; }
        .score-item.o .value { color: #f472b6; }
        .tooltip { position: relative; }
        .tooltip:hover::after {
            content: attr(data-tip);
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            color: #e2e8f0;
            padding: 0.4rem 0.7rem;
            border-radius: 6px;
            font-size: 0.8rem;
            white-space: nowrap;
            z-index: 10;
            border: 1px solid #334155;
        }
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 14px;
            font-size: 1.6rem;
            font-weight: bold;
            color: #f1f5f9;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .overlay.show { opacity: 1; }
        .win-anim { animation: pop 0.4s ease; }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container game-container">
        <a href="../index.html" class="back">← Zurück</a>
        <h1>Tic-Tac-Toe</h1>
        <p>Skill-basiert – lokal, online (bald) oder gegen KI.</p>

        <div class="controls" id="mode-controls">
            <button id="btn-local" class="active" onclick="setMode('local')">Lokal (2 Spieler)</button>
            <button id="btn-online" onclick="setMode('online')">Online (bald)</button>
            <button id="btn-ai" onclick="setMode('ai')">Gegen KI</button>
        </div>

        <div id="ai-controls" class="controls" style="display:none;">
            <span style="align-self:center;">Schwierigkeit:</span>
            <button id="diff-easy" class="tooltip" data-tip="Anfänger" onclick="setDifficulty('easy')">Leicht</button>
            <button id="diff-medium" class="tooltip" data-tip="Fortgeschritten" onclick="setDifficulty('medium')">Mittel</button>
            <button id="diff-hard" class="tooltip" data-tip="lässt dich manchmal aus Spass gewinnen" onclick="setDifficulty('hard')">Schwer</button>
            <button id="diff-adaptive" class="tooltip active" data-tip="passt sich deinem Level an" onclick="setDifficulty('adaptive')">Adaptive</button>
        </div>

        <div class="scoreboard" id="scoreboard">
            <div class="score-item x">
                <div class="label" id="label-x">Spieler X</div>
                <div class="value" id="score-x">0</div>
            </div>
            <div class="score-item">
                <div class="label">Unentschieden</div>
                <div class="value" id="score-draw">0</div>
            </div>
            <div class="score-item o">
                <div class="label" id="label-o">Spieler O</div>
                <div class="value" id="score-o">0</div>
            </div>
        </div>

        <div class="status" id="status">Spieler X ist am Zug</div>

        <div class="ttt-wrapper">
            <div class="ttt-board" id="board">
                <div class="overlay" id="overlay"></div>
            </div>
        </div>

        <div class="controls">
            <button onclick="resetGame()">Neues Spiel</button>
            <button id="btn-direct" onclick="toggleDirectRestart()">Direkter Restart: Aus</button>
            <button onclick="resetScore()" style="background:#475569;">Score zurücksetzen</button>
        </div>
    </div>

    <script>
        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('status');
        const aiControls = document.getElementById('ai-controls');
        const overlay = document.getElementById('overlay');
        const scoreXEl = document.getElementById('score-x');
        const scoreOEl = document.getElementById('score-o');
        const scoreDrawEl = document.getElementById('score-draw');
        const labelX = document.getElementById('label-x');
        const labelO = document.getElementById('label-o');
        const btnDirect = document.getElementById('btn-direct');

        let board = Array(9).fill(null);
        let current = 'X';
        let gameOver = false;
        let mode = 'local';
        let difficulty = 'adaptive';
        let startingPlayer = 'X';
        let directRestart = false;
        let waitingForHumanFirstMove = false;
        const human = 'X';
        const ai = 'O';

        let score = { x: 0, o: 0, draw: 0 };
        let adaptiveStrength = 0.35;

        const wins = [
            [0,1,2],[3,4,5],[6,7,8],
            [0,3,6],[1,4,7],[2,5,8],
            [0,4,8],[2,4,6]
        ];

        function toggleDirectRestart() {
            directRestart = !directRestart;
            btnDirect.textContent = directRestart ? 'Direkter Restart: An' : 'Direkter Restart: Aus';
            btnDirect.classList.toggle('active', directRestart);
            if (!directRestart) {
                boardEl.classList.remove('faded');
                overlay.classList.remove('show');
            }
        }

        function setMode(m) {
            mode = m;
            document.getElementById('btn-local').classList.toggle('active', m === 'local');
            document.getElementById('btn-online').classList.toggle('active', m === 'online');
            document.getElementById('btn-ai').classList.toggle('active', m === 'ai');
            aiControls.style.display = m === 'ai' ? 'flex' : 'none';
            updateLabels();
            updateScore();
            if (m === 'online') {
                statusEl.textContent = 'Online-Modus kommt mit Accounts & Matchmaking.';
                gameOver = true;
            } else {
                resetGame();
            }
        }

        function setDifficulty(d) {
            difficulty = d;
            ['easy','medium','hard','adaptive'].forEach(id => {
                document.getElementById('diff-' + id).classList.toggle('active', d === id);
            });
        }

        function updateLabels() {
            if (mode === 'ai') {
                labelX.textContent = 'Du (X)';
                labelO.textContent = 'KI (O)';
            } else {
                labelX.textContent = 'Spieler X';
                labelO.textContent = 'Spieler O';
            }
        }

        function updateScore() {
            scoreXEl.textContent = score.x;
            scoreOEl.textContent = score.o;
            scoreDrawEl.textContent = score.draw;
        }

        function render() {
            const ov = overlay;
            boardEl.innerHTML = '';
            boardEl.appendChild(ov);
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell' + (board[i] ? ' taken ' + board[i].toLowerCase() : '');
                cell.textContent = board[i] || '';
                cell.onclick = () => makeMove(i);
                boardEl.appendChild(cell);
            }
        }

        function showEnd(text, winner) {
            if (winner === 'X') score.x++;
            else if (winner === 'O') score.o++;
            else score.draw++;
            updateScore();

            if (mode === 'ai' && difficulty === 'adaptive') {
                if (winner === human) adaptiveStrength = Math.min(0.95, adaptiveStrength + 0.12);
                else if (winner === ai) adaptiveStrength = Math.max(0.2, adaptiveStrength - 0.08);
            }

            startingPlayer = startingPlayer === 'X' ? 'O' : 'X';

            if (directRestart && (mode === 'local' || mode === 'ai')) {
                overlay.classList.remove('show');
                boardEl.classList.add('faded');
                statusEl.textContent = 'Klicke auf ein Feld für neues Spiel';
                gameOver = true;
            } else {
                overlay.textContent = text;
                overlay.classList.add('show');
                boardEl.classList.add('win-anim');
                setTimeout(() => boardEl.classList.remove('win-anim'), 400);
                gameOver = true;
            }
        }

        function makeMove(i) {
            if (directRestart && gameOver && (mode === 'local' || mode === 'ai')) {
                // Direkter Restart durch Klick
                startNewGameFromClick();
                return;
            }

            if (gameOver || board[i] !== null) return;
            if (mode === 'ai' && current !== human) return;
            if (mode === 'online') return;

            // Erster Zug des Spielers nach KI-Start im Direct-Modus
            if (waitingForHumanFirstMove) {
                waitingForHumanFirstMove = false;
                boardEl.classList.remove('faded');
            }

            board[i] = current;
            if (checkWin(current)) {
                showEnd(`${current} gewinnt!`, current);
            } else if (board.every(c => c !== null)) {
                showEnd('Unentschieden!', null);
            } else {
                current = current === 'X' ? 'O' : 'X';
                statusEl.textContent = (mode === 'ai' && current === ai) ? 'KI denkt...' : `${current} ist am Zug`;
                render();
                if (mode === 'ai' && current === ai && !gameOver) {
                    setTimeout(aiMove, 400);
                }
                return;
            }
            render();
        }

        function startNewGameFromClick() {
            board = Array(9).fill(null);
            current = startingPlayer;
            gameOver = false;
            overlay.classList.remove('show');
            waitingForHumanFirstMove = false;

            if (mode === 'ai' && current === ai) {
                boardEl.classList.add('faded');
                waitingForHumanFirstMove = true;
                statusEl.textContent = 'KI beginnt...';
                render();
                setTimeout(aiMove, 400);
            } else {
                boardEl.classList.remove('faded');
                statusEl.textContent = `${current} beginnt`;
                render();
            }
        }

        function aiMove() {
            const move = chooseAiMove();
            if (move !== null && board[move] === null) {
                board[move] = ai;
                if (checkWin(ai)) {
                    showEnd('KI gewinnt!', ai);
                } else if (board.every(c => c !== null)) {
                    showEnd('Unentschieden!', null);
                } else {
                    current = human;
                    statusEl.textContent = 'Dein Zug (X)';
                    if (waitingForHumanFirstMove) {
                        // bleibt faded bis Spieler zieht
                    } else {
                        boardEl.classList.remove('faded');
                    }
                }
                render();
            }
        }

        function chooseAiMove() {
            const avail = board.map((v, i) => v === null ? i : null).filter(v => v !== null);
            if (!avail.length) return null;

            for (const i of avail) {
                board[i] = ai;
                if (checkWin(ai)) { board[i] = null; return i; }
                board[i] = null;
            }
            for (const i of avail) {
                board[i] = human;
                if (checkWin(human)) { board[i] = null; return i; }
                board[i] = null;
            }

            const perfect = minimax([...board], ai).index;
            let mistakeChance = 0.25;
            if (difficulty === 'easy') mistakeChance = 0.55;
            else if (difficulty === 'medium') mistakeChance = 0.28;
            else if (difficulty === 'hard') mistakeChance = 0.08;
            else if (difficulty === 'adaptive') mistakeChance = Math.max(0.05, 0.5 - adaptiveStrength * 0.45);

            if (Math.random() < mistakeChance && avail.length > 2) {
                const others = avail.filter(i => i !== perfect);
                if (others.length) return others[Math.floor(Math.random() * others.length)];
            }
            return perfect;
        }

        function minimax(newBoard, player) {
            const avail = newBoard.map((v, i) => v === null ? i : null).filter(v => v !== null);
            if (checkWinOn(newBoard, human)) return { score: -10 };
            if (checkWinOn(newBoard, ai)) return { score: 10 };
            if (avail.length === 0) return { score: 0 };

            const moves = [];
            for (const i of avail) {
                newBoard[i] = player;
                const result = minimax(newBoard, player === ai ? human : ai);
                moves.push({ index: i, score: result.score });
                newBoard[i] = null;
            }

            let best = moves[0];
            if (player === ai) {
                for (const m of moves) if (m.score > best.score) best = m;
            } else {
                for (const m of moves) if (m.score < best.score) best = m;
            }
            return best;
        }

        function checkWin(player) { return checkWinOn(board, player); }
        function checkWinOn(b, player) {
            return wins.some(c => c.every(i => b[i] === player));
        }

        function resetGame() {
            board = Array(9).fill(null);
            current = startingPlayer;
            gameOver = false;
            overlay.classList.remove('show');
            boardEl.classList.remove('faded');
            waitingForHumanFirstMove = false;
            statusEl.textContent = mode === 'ai' && current === ai ? 'KI beginnt...' : `${current} beginnt`;
            render();
            if (mode === 'ai' && current === ai) {
                setTimeout(aiMove, 500);
            }
        }

        function resetScore() {
            score = { x: 0, o: 0, draw: 0 };
            adaptiveStrength = 0.35;
            startingPlayer = 'X';
            updateScore();
            resetGame();
        }

        setMode('local');
        setDifficulty('adaptive');
    </script>
</body>
</html>
