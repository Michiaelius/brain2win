<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4 Gewinnt – Brain2Win</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .c4-board {
            grid-template-columns: repeat(7, 1fr);
            width: 420px;
            height: 360px;
        }
        .cell {
            background: #1e293b;
            border-radius: 50%;
            width: 52px;
            height: 52px;
            margin: 2px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .cell.red { background: #ef4444; }
        .cell.yellow { background: #eab308; }
        .col-click {
            cursor: pointer;
        }
        .col-click:hover .cell:not(.red):not(.yellow) {
            background: #334155;
        }
    </style>
</head>
<body>
    <div class="container game-container">
        <a href="../index.html" class="back">← Zurück</a>
        <h1>4 Gewinnt</h1>
        <p>Connect Four – Strategie und Vorausschau. Hotseat für zwei Spieler.</p>
        <div class="status" id="status">Rot ist am Zug</div>
        <div class="board c4-board" id="board"></div>
        <button onclick="resetGame()">Neues Spiel</button>
    </div>

    <script>
        const ROWS = 6, COLS = 7;
        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('status');
        let board = Array.from({length: ROWS}, () => Array(COLS).fill(null));
        let current = 'red';
        let gameOver = false;

        function render() {
            boardEl.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (board[r][c]) cell.classList.add(board[r][c]);
                    cell.dataset.col = c;
                    cell.onclick = () => drop(c);
                    boardEl.appendChild(cell);
                }
            }
        }

        function drop(col) {
            if (gameOver) return;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (!board[r][col]) {
                    board[r][col] = current;
                    if (checkWin(r, col, current)) {
                        statusEl.textContent = `${current === 'red' ? 'Rot' : 'Gelb'} gewinnt!`;
                        gameOver = true;
                    } else if (board.flat().every(c => c)) {
                        statusEl.textContent = 'Unentschieden!';
                        gameOver = true;
                    } else {
                        current = current === 'red' ? 'yellow' : 'red';
                        statusEl.textContent = `${current === 'red' ? 'Rot' : 'Gelb'} ist am Zug`;
                    }
                    render();
                    return;
                }
            }
        }

        function checkWin(row, col, player) {
            const dirs = [[0,1],[1,0],[1,1],[1,-1]];
            for (const [dr, dc] of dirs) {
                let count = 1;
                for (const sign of [1, -1]) {
                    let r = row + dr * sign, c = col + dc * sign;
                    while (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === player) {
                        count++;
                        r += dr * sign;
                        c += dc * sign;
                    }
                }
                if (count >= 4) return true;
            }
            return false;
        }

        function resetGame() {
            board = Array.from({length: ROWS}, () => Array(COLS).fill(null));
            current = 'red';
            gameOver = false;
            statusEl.textContent = 'Rot ist am Zug';
            render();
        }

        render();
    </script>
</body>
</html>
